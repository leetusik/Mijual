<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><link rel="stylesheet" href="r12-auth.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../_ds_bundle.js"></script>
</head><body class="cosmos"><div id="root"></div>
<script type="text/babel" src="r12-parts.jsx"></script>
<script type="text/babel">
ReactDOM.createRoot(document.getElementById('root')).render(<React.Fragment>

<div className="cases">
  <ACase label="로그인 · idle — 인터랙티브 (모드 전환 · 제출 → 확인 중… → 오류 · 재설정: 주소 없으면 이메일 칸으로 포커스). 페이지 프레임 = 레일 한 줄 + 480 열 + 하단 샘플 진입">
    <AAuthLive />
  </ACase>
  <ACase label="계정 만들기 · idle — 같은 패널, 전환 링크의 라벨이 다른 모드의 이름이다. 비밀번호 라벨 행에 「8자 이상」 (Q-C) · 재설정 링크 없음 (계정 만들기 쪽에는 재설정할 것이 없다)">
    <AAuth id="s" mode="signup" email="reader@example.com" pw="" />
  </ACase>
</div>

<div className="cases">
  <ACase label="확인 중… — 버튼 라벨이 상태다 (disabled + opacity .72, 스피너 없음). 조용한 행도 요청이 날아가는 동안만 disabled">
    <AAuth id="p" mode="login" bare email="reader@example.com" pw="password" pending />
  </ACase>
  <ACase label="오류 — 본문 한 줄, 필드 옆 아님, 어느 필드가 틀렸는지 특정하지 않음. ink-1 (alert 아님 — 빨강은 소멸·마감 전용)">
    <AAuth id="e" mode="login" bare email="reader@example.com" pw="wrongpass" line={A_ERR_CRED} />
  </ACase>
</div>

<div className="cases">
  <ACase label="알림 — 같은 슬롯, ink-2. 가입 여부를 노출하지 않으므로 어떤 주소에도 같은 문장이 온다">
    <AAuth id="n" mode="login" bare email="reader@example.com" pw="" line={A_RESET_SENT} soft />
  </ACase>
  <ACase label="로그아웃되었습니다 (finding 10) — 이전 행동의 영수증이므로 제목 위 자기 밴드. 폼 아래 줄은 이 폼의 답이 서는 자리다. 첫 타이핑이나 제출로 사라지고, 타이머는 없다">
    <AAuth id="f" mode="login" bare flash />
  </ACase>
</div>

<div className="cases">
  <ACase label="빈 입력 (Q-A = b · 신규) — noValidate로 브라우저 영어 말풍선이 사라지고, 같은 오류 슬롯이 한국어로 답한다">
    <AAuth id="q1" mode="login" bare line={A_NEW_EMPTY} />
  </ACase>
  <ACase label="이메일 형식 (Q-A = b · 신규) — copy.ts가 「한국어 없음」으로 적어둔 invalid_email의 빈자리를 메운다">
    <AAuth id="q2" mode="signup" bare email="reader@example" pw="password1" line={A_NEW_EMAIL} />
  </ACase>
</div>

<div className="cases">
  <ACase label="8자 미만 — 규칙은 이미 라벨 행에 있었고(Q-C), 오류는 그 규칙의 서명된 문장이다. 계정 만들기에서만 클라이언트가 먼저 말한다 (로그인에서 짧은 비밀번호는 규칙 위반이 아니라 틀린 비밀번호 = 불일치)">
    <AAuth id="q3" mode="signup" bare email="reader@example.com" pw="1234" line={A_ERR_SHORT} />
  </ACase>
  <ACase label="중복 가입 — 계정 만들기의 나머지 서명된 실패 한 줄">
    <AAuth id="q4" mode="signup" bare email="reader@example.com" pw="password1" line={A_ERR_TAKEN} />
  </ACase>
</div>

<ALab>재설정 어포던스 (finding 1) — 주소 전 / 주소 후. disabled 회색 문구를 폐기하고, 눌리면 필요한 것을 가리킨다: 이메일 칸으로 포커스. 요청이 날아가는 동안에만 disabled(세 번째)</ALab>
<div className="panel" style={{padding:'18px 20px',display:'grid',gap:14}}><i className="bk" aria-hidden="true"></i>
  <div className="cases" style={{gap:32}}>
    <div className="case"><ALab>주소 없음 — 눌러도 요청은 없고 이메일 칸에 포커스 링이 선다 (R11의 프롬프트 → 입력 포커스와 같은 문법)</ALab>
      <div className="aquiet"><button className="aq" type="button">계정 만들기</button><button className="aq hov" type="button">비밀번호 재설정</button></div>
      <div className="afield" style={{maxWidth:300}}><div className="alrow"><span className="albl">이메일</span></div><input className="ainput f" defaultValue="" /></div>
    </div>
    <div className="case"><ALab>주소 있음 — 같은 컨트롤, 이제 요청이 간다. 응답은 오류 슬롯의 알림 한 줄</ALab>
      <div className="aquiet"><button className="aq" type="button">계정 만들기</button><button className="aq foc" type="button">비밀번호 재설정</button></div>
      <div className="afield" style={{maxWidth:300}}><div className="alrow"><span className="albl">이메일</span></div><input className="ainput" defaultValue="reader@example.com" readOnly /></div>
    </div>
    <div className="case"><ALab>요청 중 — 이때만 disabled (ink-3 + 점선 밑줄 색)</ALab>
      <div className="aquiet"><button className="aq" type="button" disabled>계정 만들기</button><button className="aq" type="button" disabled>비밀번호 재설정</button></div>
      <button className="asubmit" style={{maxWidth:300}} disabled>확인 중…</button>
    </div>
  </div>
</div>

<ALab>포커스 · 호버 (finding 9) — 입력은 2px --focus-ring, offset −1 (48px 칸의 테두리를 대체하지 않고 안쪽에 선다) · 버튼과 조용한 링크는 offset 2 · 호버는 색 변화만 (ink-2 → ink-1), 테두리·배경 반전 없음 · 레일도 같은 규칙</ALab>
<div className="panel" style={{padding:'18px 20px'}}><i className="bk" aria-hidden="true"></i>
  <div className="cases" style={{gap:28}}>
    <div className="case"><ALab>입력 idle</ALab><input className="ainput" style={{width:260}} defaultValue="reader@example.com" readOnly /></div>
    <div className="case"><ALab>입력 focus-visible</ALab><input className="ainput f" style={{width:260}} defaultValue="reader@example.com" readOnly /></div>
    <div className="case"><ALab>주 버튼 focus-visible</ALab><button className="asubmit foc" style={{width:200}}>로그인</button></div>
    <div className="case"><ALab>주 버튼 disabled</ALab><button className="asubmit" style={{width:200}} disabled>확인 중…</button></div>
    <div className="case"><ALab>조용한 링크 idle / hover / focus</ALab>
      <div className="aquiet"><button className="aq" type="button">계정 만들기</button><button className="aq hov" type="button">계정 만들기</button><button className="aq foc" type="button">계정 만들기</button></div></div>
    <div className="case"><ALab>레일 focus-visible</ALab><nav className="arail"><a className="foc" href="#">← 관제 현황판</a></nav></div>
  </div>
</div>

<ALab>390 — 하나의 브레이크포인트 767px (R5의 480px 블록 폐기). 열 전폭 · 패널 패딩 20/16 · 주 버튼은 데스크톱과 같은 전폭 48px (finding 5) · 샘플 부제는 balance + keep-all로 「클릭 한 / 번.」 고아 해소 (finding 6)</ALab>
<div className="cases">
  <div className="m390"><AAuth id="m1" mode="login" email="" pw="" /></div>
  <div className="m390"><AAuth id="m2" mode="signup" email="reader@example.com" pw="1234" line={A_ERR_SHORT} /></div>
  <div className="m390"><AAuth id="m3" mode="login" flash line={A_RESET_SENT} soft email="reader@example.com" /></div>
</div>

<div className="note">
<b>페이지 프레임 (Q-D) —</b> 레일 <b>있음</b>: 「← 관제 현황판」 한 줄이 480 열의 첫 행에 서고, 패널은 R5가 그린 그대로 가운데 열에 남는다. 이유는 일관성보다 탈출로다 — 제안에서 넘어온 익명 독자가 계정을 만들지 않기로 했을 때, 이 페이지는 지금까지 제품의 유일한 막다른 길이었다. 신규 카피 없음 (레일 문구는 전 표면 공용).<br />
<b>재설정 어포던스 (finding 1) —</b> <code>disabled</code> + 회색 문구 <b>폐기</b>. 주소가 없을 때 컨트롤은 살아 있고, 눌리면 요청 대신 <b>이메일 칸으로 포커스</b>가 간다 — R11의 「보유 주식 수를 입력하면…」 프롬프트가 strip 입력으로 포커스를 보내는 것과 같은 문법이다. 문장을 하나도 새로 쓰지 않고 「무엇이 필요한지」를 말하는 방법이 이 시스템에는 이미 있었다. <code>disabled</code>는 요청이 날아가는 동안에만 존재한다.<br />
<b>규칙을 앞에 (Q-C = 예) —</b> 「8자 이상」이 비밀번호 라벨 행 오른쪽에 mono <code>text-xs</code>로 선다. <b>계정 만들기와 재설정 페이지에만</b> — 로그인에서 길이는 규칙이 아니라 틀린 비밀번호이고, 거기 규칙을 적으면 하지 않는 검사를 한다고 말하는 셈이다. 문장이 아니라 R5-1의 규칙 표현 그대로의 <b>토큰 하나</b>(신규 1건).<br />
<b>브라우저 말풍선 (Q-A = b) —</b> <code>noValidate</code> + 오류 슬롯의 한국어 <b>두 줄</b>. 핸드오프 기본값 (c)를 택하지 않은 이유: 계정 만들기에서 빈 주소는 <code>invalid_email</code>로 가고 그 코드에는 서명된 한국어가 없어서(<code>authErrorKo</code> → <code>null</code>) <b>아무 줄도 없는 제출</b>이 된다. 두 줄인 이유: 빈 입력과 형식 오류는 서로 다른 사실이고, 형식 줄은 <code>copy.ts</code>가 「한국어 없음」으로 적어둔 빈자리를 그대로 메운다.<br />
<b>주 버튼 (finding 5) —</b> <b>전폭 48px, 두 브레이크포인트 동일</b>. 160px 좌측 정렬 폐기 — R4/R11의 조회 48px는 입력 <b>옆</b>에 서는 행의 짝이고, 이 버튼은 스택된 두 칸 <b>아래</b>의 마지막 칸이다. 같은 48px 높이를 쓰지만 폭의 근거가 다르다.<br />
<b>네 상태 (finding 9) —</b> idle → 확인 중…(라벨 교체 + disabled, 스피너 없음) → 오류(본문 ink-1 한 줄) → 알림(같은 슬롯, ink-2). 슬롯은 하나이고 <code>role="status"</code> 하나가 그 자리를 읽는다. 오류에 <code>--alert</code>를 쓰지 않는다 — 빨강은 소멸·마감 전용이고, 로그인 실패는 경보가 아니다.<br />
<b>로그아웃 알림 (finding 10) —</b> 제목 <b>위</b> inset 밴드. 폼 아래 줄은 이 폼의 답이 서는 자리이므로, 다른 화면에서 일어난 행동의 영수증을 거기 놓으면 하지 않은 제출의 응답처럼 읽힌다. <b>타이머 없음</b> — 첫 타이핑이나 제출, 또는 이동이 지운다 (1회 표시는 플래시 채널이 이미 보장한다).<br />
<b>PII inset 삭제 (운영자 지시, 이 세션) —</b> 「미주알이 받는 것 …」 / 「저장하지 않는 것은 …」 두 줄을 <b>두 auth 화면 모두에서 제거</b>했다. R5-1의 「PII 패널은 로그인 화면 상시 요소」 조항은 이로써 회수되고, finding 12(티어 확인)는 삭제로 종결된다. 패널이 짧아진 만큼 폼 → 오류 슬롯 → 조용한 행 → 샘플 진입의 순서는 그대로다.<br />
<b>제목 의미 (finding 13) —</b> <code>h1</code> = 모드 이름(로그인 / 계정 만들기 / 비밀번호 재설정) 하나뿐 · 소개문은 <code>p</code> · 샘플 진입은 제목 없는 <code>section</code> · 오류/알림은 <code>p role="status"</code> 하나 · 전환 링크와 재설정은 <code>button</code>(둘 다 이동하지 않는다) · 레일은 <code>nav</code>.<br />
<b>잠금 유지 —</b> 이메일+비밀번호 두 칸뿐 (OAuth·코드 로그인·remember me 없음) · 8자 이상 외 규칙 없음 · 가입 여부 비노출(어떤 주소에도 같은 알림) · 로그인 실패는 필드 특정 없음 · 샘플 진입 하단 고정 · 익명 경로 비차단.
</div>
</React.Fragment>);
</script></body></html>
