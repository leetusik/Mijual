<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><link rel="stylesheet" href="../detail/r10-detail.css"><link rel="stylesheet" href="../lookup/r11-lookup.css"><link rel="stylesheet" href="r12-auth.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../_ds_bundle.js"></script>
</head><body class="cosmos"><div id="root"></div>
<script type="text/babel" src="../lookup/r11-parts.jsx"></script>
<script type="text/babel" src="r12-parts.jsx"></script>
<script type="text/babel">
/* R10의 헤더 패널 (detail/r10-parts.jsx의 Head와 같은 마크업 · 같은 기하) — 여기서는
   담기 줄의 두 상태를 보이기 위해서만 다시 그린다. */
const dartUrl = (n) => 'https://dart.fss.or.kr/dsaf001/main.do?rcpNo=' + n;
const KY_HEAD = { type: 1, name: '계양전기', rcept: '20260724000546', filed: '2026-05-08', corrected: '정정 반영',
  cdLabel: '신주인수권증서 매매 마감', days: 2, date: '2026-08-25',
  win: { dates: '2026-08-19 ~ 2026-08-25', phrase: '거래 가능 · 마감 D-2' } };

function DHead({ auth }) {
  const h = KY_HEAD;
  return <APanel><div className="hd">
    <div className="hid">
      <div className="hchip"><RightsChip type={h.type} /></div>
      <div className="corpline"><h1 className="corp">{h.name}</h1><a className="dart" href={dartUrl(h.rcept)} target="_blank" rel="noreferrer">DART 원문 ↗</a></div>
      <p className="meta"><span>접수번호 {h.rcept}</span><span>최초 공시 {h.filed}</span><span className="corr">{h.corrected}</span></p>
    </div>
    <div className="cd">
      <p className="cdlab">{h.cdLabel}</p>
      <div className="ddayslot"><DDay days={h.days} date={h.date} /></div>
      <p className="win"><span className="dates">{h.win.dates}</span><span className="live">{h.win.phrase}</span></p>
      {auth === 'anon' ? <a className="offer" href="#">{A_DEADLINE}</a> : null}
      {auth === 'in' ? <a className="offer" href="#">{A_ADD}</a> : null}
    </div>
  </div></APanel>;
}

/* R11 조회 페이지 (한화솔루션 · 500주) — 값이 계산된 다음의 페이지 꼬리. 제안이 어디에
   서는지가 이 카드의 전부이므로 나머지는 R11 파트 그대로다. */
function LookupTail({ offer, onDismiss }) {
  const [n, setN] = React.useState(500);
  const ref = React.useRef(null);
  return <div className="page">
    <Identity name="한화솔루션" code="00162461" strip={<Strip n={n} setN={setN} inputRef={ref} />} />
    <Sec title="진행 중인 권리 — 0건"><Panel><p className="closed">청약 <span className="v">2026-07-23</span> 종료</p></Panel></Sec>
    <Sec title="2026년 놓친 돈"><Missed rows={HANWHA_LAPSE} n={n} /></Sec>
    {offer ? <AOffer onDismiss={onDismiss} /> : null}
    <CoverageTrimmed />
    <Prov />
  </div>;
}

/* R11의 집계 범위 패널 — 같은 기하, 경계 캡션 한 줄만 제거 (운영자 지시). R11 카드의
   parts는 손대지 않으므로 lookup/ 표면은 그대로다. */
function CoverageTrimmed() {
  return <section className="sec"><h2 className="eyebrow">집계 범위</h2>
    <Panel><div className="cvg"><div className="cvgrows">
      <p className="cvgrow"><RightsChip type={1} compact />2026-01-01부터</p>
      <p className="cvgrow"><RightsChip type={2} compact />2025-06-01부터</p>
    </div></div></Panel>
  </section>;
}

function LookupCase() {
  const [shown, setShown] = React.useState(true);
  return <React.Fragment>
    <ALab>ConversionOffer — 「값 계산 직후」의 자리: 마지막 데이터 섹션(놓친 돈) 뒤, 집계 범위·프로비넌스 앞. 데이터 섹션 사이에 끼어들지 않고, 페이지 맨 끝에 밀려나지도 않는다. 표면은 inset 밴드 — 브래킷도 글로우도 없어서 자기가 응답하는 숫자보다 결코 커 보이지 않는다. 「닫기」를 눌러 보세요 (자리를 대신 채우는 것은 없다)</ALab>
    <LookupTail offer={shown} onDismiss={() => setShown(false)} />
    {shown ? null : <p className="note" style={{maxWidth:960}}><b>닫힌 뒤 —</b> 밴드가 사라진 자리에 아무것도 서지 않는다. 세션 플래그가 이미 세션당 1회를 보장하므로 같은 세션의 다른 종목에서도 다시 묻지 않는다. 카드를 새로 고치면 다시 나타난다.</p>}
  </React.Fragment>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<React.Fragment>

<ALab>서열 (finding 11) — 위에서 아래로: 페이지의 숫자 &gt; 제안 밴드(inset, CTA 44px) &gt; 상세 헤더의 한 줄 링크 &gt; nav 로그인. 표면의 층이 서열이고, 문구 크기가 아니다</ALab>
<div className="panel" style={{padding:0,maxWidth:960}}><i className="bk" aria-hidden="true"></i>
  <ANav />
  <div style={{padding:'14px 20px'}}><p className="note" style={{border:0,padding:0,margin:0}}>nav 로그인 = R8 서명 그대로, 강조 없음 (rgba .68). 세 자리 중 가장 조용하고, 로그인 여부와 무관하게 라벨은 하나다.</p></div>
</div>

<LookupCase />

<ALab>DeadlineOffer (R10 헤더) — 익명 / 로그인. 한 줄 텍스트 링크, 32px(≤767px 44px), 환산 버튼에 종속되는 부(副) 서열 그대로. 세션이 확인되기 전에는 <b>아무것도 렌더하지 않는다</b> — 두 문장은 독자의 상태를 서로 다르게 말하므로, 먼저 하나를 보여주고 바꾸면 로그인한 독자에게 한순간 계정이 없다고 말하는 셈이다</ALab>
<div className="cases">
  <ACase label="익명 — 「이 마감 알림 받기 →」 → /auth/login (마감이 아직 앞에 있을 때만)"><div style={{width:600}}><DHead auth="anon" /></div></ACase>
  <ACase label="로그인 — 「보유 종목에 담기 →」 (R10 서명 문구) → /portfolio?add=…, 링크를 따라가도 아무것도 저장되지 않는다"><div style={{width:600}}><DHead auth="in" /></div></ACase>
</div>

<ALab>390 — 제안 밴드는 전폭, CTA는 전폭 44px. 헤더의 담기 줄은 R10의 390 스택 순서(라벨 → D-day → 창 → 담기 → DART) 그대로 44px</ALab>
<div className="cases">
  <div className="m390"><AOffer /></div>
  <div className="m390"><DHead auth="anon" /></div>
</div>

<div className="note">
<b>세 자리를 한 벌로 (finding 11) —</b> 같은 제안이 세 층에 있고, 층마다 <b>표면</b>이 서열을 말한다. ① 조회 결과의 <b>inset 밴드</b> — 브래킷·글로우 없는 한 단 아래 표면, 44px CTA 하나, 「닫기」 하나. ② 상세 헤더의 <b>한 줄 텍스트 링크</b> — R10이 정한 부(副) 서열(주는 환산 44px 버튼). ③ nav <b>로그인</b> — 가장 조용한 층, 강조 없음. 이 순서는 독자가 그 지점에서 이미 본 숫자의 크기와 같은 순서다.<br />
<b>「값 계산 직후」의 자리 —</b> 마지막 데이터 섹션 뒤, <b>집계 범위·프로비넌스 앞</b>. 데이터 섹션 <b>사이</b>에 넣지 않는 이유: 보드의 리듬을 끊고 놓친 돈을 제안 아래로 밀어낸다. 페이지 <b>맨 끝</b>에 두지 않는 이유: 그 자리는 출처와 면책의 자리이고, 거기 놓인 제안은 푸터 배너로 읽힌다. 「결과를 가리지 않음」과 「직후」를 동시에 만족하는 자리는 이 하나다.<br />
<b>로그인 후 도착지 (Q-B) —</b> 기본값 유지 — 모든 로그인은 <b>/portfolio</b>로 가고, 출발지(그 종목·그 이벤트)는 <b>싣지 않는다</b>. 제안 카피에 도착지를 적는 것도 하지 않았다: R5-2의 본문이 이미 「계정에 저장하면 마감이 다가올 때 이메일로 알립니다」로 <b>무엇이 일어나는지</b>를 말하고 있어서, 「어디로 가는지」를 덧붙이면 잠긴 문단에 신규 문장을 하나 더 얹는 대가로 같은 사실을 두 번 말하게 된다. 출발지 이월은 새 쿼리 플러밍 = 기능이므로 이 폴리시 라운드 밖 (운영자가 폴리시라고 부르면 R13에서).<br />
<b>제안이 제안인 조건 —</b> <code>position:fixed</code> 없음 · 오버레이 없음 · 게이트 화면 없음 · 세션당 1회 · 닫기 가능 · 익명 표면의 동작은 밴드가 있든 없든 동일. <b>운영자 지시로 밴드의 두 번째 문장(「지금처럼 로그인 없이 계속 쓸 수 있습니다」)과 본문 뒷절(「— 계정은 이메일과 비밀번호뿐입니다.」)은 삭제</b>했다 — 제안이 게이트가 아니라는 사실은 문장이 아니라 동작(닫기 · 세션당 1회 · 익명 경로 무변경)이 말한다. 집계 범위의 경계 캡션 한 줄도 이 카드에서 제거했다 (R11 카드의 parts는 손대지 않음).<br />
<b>이 카드가 빌려온 것 —</b> 조회 페이지는 <code>lookup/r11-lookup.css</code> + <code>r11-parts.jsx</code>, 상세 헤더는 <code>detail/r10-detail.css</code>의 기하 그대로다. R12가 추가한 것은 밴드 하나(<code>.aoffer</code>)와 그 자리뿐 — 두 표면의 값·문구·열은 손대지 않았다.
</div>
</React.Fragment>);
</script></body></html>
