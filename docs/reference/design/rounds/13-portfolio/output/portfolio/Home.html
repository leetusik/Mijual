<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><link rel="stylesheet" href="r13-portfolio.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../_ds_bundle.js"></script>
</head><body class="cosmos"><div id="root"></div>
<script type="text/babel" src="r13-parts.jsx"></script>
<script type="text/babel">
/* 계정 모드 — 편집·삭제·되돌리기·체크가 실제로 동작한다 (모달 없음, 오버레이 없음). */
function Live() {
  const [rows, setRows] = React.useState(P_HOLDINGS);
  const [editing, setEditing] = React.useState(null);
  const [undo, setUndo] = React.useState(null);
  const [claims, setClaims] = React.useState({});
  const timer = React.useRef(null);

  const save = (row, digits) => {
    const n = parseInt(digits, 10);
    if (!isNaN(n) && n !== row.shares) setRows(rows.map((r) => (r.code === row.code ? { ...r, shares: n } : r)));
    setEditing(null);
  };
  const remove = (row) => {
    setEditing(null);
    setRows(rows.filter((r) => r.code !== row.code));
    setUndo({ code: row.code, name: row.name, shares: row.shares, row });
    if (timer.current) window.clearTimeout(timer.current);
    timer.current = window.setTimeout(() => setUndo(null), 8000);
  };
  const restore = () => {
    if (!undo) return;
    if (timer.current) window.clearTimeout(timer.current);
    /* 되돌린 행은 새 보유다 — created_at 순서라 목록의 마지막에 붙는다 (P5.S8). */
    setRows([...rows.filter((r) => r.code !== undo.code), undo.row]);
    setUndo(null);
  };

  return <React.Fragment>
    <PHoldings rows={rows} mode="account" editing={editing} undo={undo}
      onEdit={setEditing} onCancel={() => setEditing(null)} onSave={save} onDelete={remove} onUndo={restore} />
    <PLab>인라인 편집: 보유량 셀만 입력으로 바뀌고 액션 열이 수정·삭제 → 저장·취소로 제자리 교체 (가로 유지, R5 개정 ④) · 삭제 = 즉시 + 8초 되돌리기 inset 행 (토스트·모달 없음) · 되돌린 행은 새 보유이므로 목록 끝에 붙는다</PLab>
    <PSec title={P_ADD_SECTION}><PAdd /></PSec>
    <PLab>진행 중인 권리 셀이 빈 두 행(한화솔루션 · 세기상사) = 지난 권리만 가진 종목. 셀은 파선 하이라인 — R10/R11이 이미 쓰는 「이 자리에 값이 없다」 표시이며, 파선 상자(=이 시스템의 컨트롤)가 아니다. 새 카피 없음</PLab>
    <PDeadlines reference={P_REF} upcoming={P_UPCOMING_ROWS} past={P_PAST_ROWS} caption="account"
      claims={claims} onClaim={(row, on) => setClaims({ ...claims, [row.id]: on })} />
    <PLab>지나간 ① 소멸 행의 체크박스를 눌러 보십시오 — 라벨 놓친 돈 → 챙긴 돈, 색 alert → live, 금액과 「추정」은 그대로 (R5-8) · 체크되면 「놓친 돈 상세 →」도 사라진다 (이번 세션 개정) · 캡션은 체크와 무관하게 항상 렌더 — 조건부로 만들면 클릭마다 22.6px가 움직인다 (finding 5)</PLab>
  </React.Fragment>;
}

function App() {
  return <div className="psurf">
    <PLab>보유 종목 · 계정 모드 — 본문 대제목 없음(위치는 nav slot, R5 개정 ③) · 폭 960 (제품의 값) · 단일 767 경계</PLab>
    <Live />

    <div className="note"><b>finding 1 — D-day 행의 데스크톱 기하 (이 라운드의 표제).</b> 기존 <code>.rowHead</code>는 <code>space-between</code>이어서 1440에서 오른쪽 블록의 왼쪽 edge가 144.7px 들쭉날쭉했고 가운데가 584.6–761.3px 비었다. 답은 표도, 중앙정렬도 아니다 — <b>내용과 무관한 네 트랙</b>(<code>84px · 1fr · 212px · 208px</code>)을 두 섹션의 모든 행이 공유하고, 열 머리글도 세로선도 두지 않는다. 행 본문(①의 환산 셀, ②의 희석 셀, ③의 의존 문장, 소멸 금액)은 <b>열 2에서 시작해 마지막 트랙에서 끝난다</b> — 그래서 금액의 오른쪽 edge가 위 카운트다운과 같은 선에 선다. 가운데는 「두 블록 사이의 빈 공간」이 아니라 종목명의 열이 된다.</div>
    <div className="note"><b>finding 3 — 앵커 한 줄의 자리.</b> 페이지 것이다. 지나간 D+n까지 모두 같은 서버 <code>reference</code>로 계산된 값이므로, 「기준 2026-08-24 (KST)」는 <b>블록 위에 한 번</b> 선다 — 다가오는 마감 아래(그 섹션의 속성으로 읽힌다)도, 두 섹션에 각각(기준이 둘인 것처럼 읽힌다)도 아니다.</div>

    <PLab>빈 보유 종목 + 세션 이월 제안 (R5-3) — 자동 저장 없음</PLab>
    <PEmpty />
    <PCarry variant="session" entries={[{ code: '00102618', name: '계양전기', shares: 500 }]} />
    <PLab>담지 않기 = 제안만 닫는다 (세션 플래그). 브라우저의 값은 그대로 남고, 새 세션은 다시 물어볼 수 있다</PLab>

    <PLab>샘플을 가진 브라우저로 로그인했을 때 — 계정 이전 제안 (R5-4). 문장 없음: 라벨 + 데이터(종목명·주수) + 서명된 두 컨트롤</PLab>
    <PCarry variant="migrate" entries={[
      { code: '00102618', name: '계양전기', shares: 500 },
      { code: '00113058', name: '대동기어', shares: 300 },
      { code: '00162461', name: '한화솔루션', shares: 500 },
      { code: '00133618', name: '세기상사', shares: 100 }]} />
    <PLab>익명 쓰기는 어디에도 없다 — 담기를 누른 순간 평범한 인증된 POST 4건이 되고, 그때 샘플 모드가 끝난다 (clearSample). 자동 이전 금지</PLab>

    <PLab>?add= 로 들어온 종목 추가 (조회에서 담기) — 종목 칸은 미리 채워지고 포커스는 보유량 · 이미 담긴 종목이면 새 행이 아니라 그 행의 수정이 열린다 (「이미 담긴 종목」 문장 없음)</PLab>
    <PAdd value="계양전기" preselect />

    <div className="note"><b>finding 2 — 빈 진행 중인 권리 셀.</b> R5는 빈 셀 문장을 서명하지 않았고, walk의 질문은 「셀이 무엇이어야 하나」다(무슨 한국어를 만들까가 아니다). 답: <b>파선 하이라인</b> 56px — R10/R11이 이미 쓰는 「값 없음」 표시. 파선 <em>상자</em>는 이 시스템에서 컨트롤(<code>.prompt</code>/<code>.restore</code>)이므로 쓰지 않는다. 행 리듬도 유지된다.</div>
    <div className="note"><b>Q-A · Q-B (§2b, 운영자 결정).</b> 챙겼습니다 행은 <b>지나간 마감에 남는다</b> — R5-8이 같은 행·같은 숫자에 라벨과 색만 바꾸는 것으로 서명했다. <b>이번 세션 개정</b>: 체크된 행에서는 <b>「놓친 돈 상세 →」도 사라진다</b> — 그 행은 이미 놓친 돈이 아니라고 말하고 있으므로 「놓친 돈」을 부르는 링크가 남아 있을 자리가 없다. 체크를 풀면 링크가 돌아온다. 카피를 만들지도, 옮기지도 않았다.</div>
    <div className="note"><b>Q-C.</b> <code>carryOverKo</code>의 「이 세션에 남아 있습니다」는 그대로 — 임시성을 전하는 유일한 단어이고, 새 문장을 만들 값이 아니다. 계정 캡션도 「본인 표시 · 계정에 저장」 유지(표시가 계정을 따라간다는 독자 자신의 사실), 샘플은 P7이 다듬은 「본인 표시」.</div>
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script></body></html>
