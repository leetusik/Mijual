<div className="note">
<b>패널 제목 (walk 6) —</b> 한 종목 페이지에서 <b>회사명은 h1에 한 번</b>만 나온다. 패널의 <code>h3</code>는 <b>지배 라벨</b>(신주인수권증서 매매 마감 / 매수청구 행사 마감)이고, 어떤 건인지는 <b>접수번호 · 공시일</b> 메타가 든다. 풍전약품 ×3의 「풍전약품 · 풍전약품 · 풍전약품」은 이 규칙만으로 사라진다.<br />
<b>② = 표, ①③ = 패널 (walk 7) —</b> ②는 <b>행사할 것이 없는 맥락</b>이다 (R4-4: 맥락일 뿐 금액이 아니다). 맥락은 <b>비교되는 형태</b>가 맞다 — 세 건이 나란히 서면 전환가액·오버행·개시일의 차이가 한눈에 읽히고, 600px이 ≈190px이 된다. ①과 ③은 <b>독자가 행동할 수 있는 마감</b>을 갖기 때문에 패널로 남는다. 「전환 시 주식수」 칸은 계약에 남아 있다 (R4-4가 지명한 세 가지 사실). <b>⋯ 표기</b>: 이 핸드오프가 싣지 않은 값이며, 카드가 값을 지어내지 않는다는 표시다 — 적용 슬라이스는 <code>convertible_api_facts</code>에서 그대로 읽는다. 풍전약품 20250930000508의 전환가액 1,182원 · 오버행 4.29% · 개시 2026-10-02과 대동기어 15,552원 · 6.68% · 2026-10-24는 grounding의 실값이고, 나머지 두 행의 개시일은 핸드오프의 D-day를 오늘(2026-08-24)에 더한 값이다.<br />
<b>표의 프로비넌스 —</b> 스트립 아래 한 줄이 티어를 말한다 (<code>DART 공시 API — 전환가액 · 전환 시 주식수 · 오버행</code>) — R10 §3의 규칙 그대로, 칸마다 <code>[근거]</code>를 달지 않는다.<br />
<b>③ 처음 그리다 (walk 8) —</b> 두 단계는 R10의 절차 블록 문법을 그대로 쓴다 (1단계/2단계 하이라인 필 · 지난 단계 「기한 지남」 · 의존 문장 한 줄). <b>무일정형</b>: <code>dday: null</code> → D-day 자리에 <code>StateBadge 추후결정</code>, 단계 창이 없으면 <b>점선</b> 「현재 버전 공시에 없음」. 실선 칩 = 공시가 「추후결정」이라 답함, 점선 = 공시가 필드를 담지 않음.<br />
<b>이벤트로 가는 길 한 규칙 (walk 5) —</b> 모든 섹션에서 이벤트로 가는 문은 <b>「상세 보기 →」</b> 하나다 — ① 패널 하단, ② 표의 행 끝, 놓친 돈 건의 이름 아래. <b>접수번호는 링크가 아니다</b> (식별자이며, 원문으로 가는 길은 상세 페이지와 <code>[근거]</code>가 가진다). 히트 데스크톱 32px / 모바일 44px.
