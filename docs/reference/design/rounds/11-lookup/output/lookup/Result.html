<div className="note">
<b>종목 아이덴티티 (walk 1 · Q-B = yes) —</b> 결과 페이지의 <code>h1</code>은 <b>종목명</b>이고, 그 아래 모노 메타가 고유번호를 든다 (<code>stock.stock_code</code>가 서빙되면 <b>종목코드가 먼저</b> 오고 고유번호가 뒤에 붙는다 — 두 값 모두 서버의 것이며 카드가 지어내지 않는다). 검색 필드는 <b>해결된 종목명을 그대로 담는다</b>: 결과 위에서 빈 입력은 「무엇을 조회했는지」를 지우는 유일한 요소였다.<br />
