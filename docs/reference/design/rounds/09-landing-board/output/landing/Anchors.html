  let s = Math.max(0, Math.floor((new Date('2026-09-05T00:00:00+09:00').getTime() - now) / 1000));

    <p className="cd">{d}일 {p2(Math.floor(s / 3600))}<span className="tick">:</span>{p2(Math.floor(s % 3600 / 60))}<span className="tick">:</span>{p2(s % 60)}</p>

}
