<div className="note">
<b>보이는 계약 (운영자 q5: refresh = 자동) —</b> 페이지가 열려 있는 동안 보드 데이터를 주기적으로 다시 읽는다. 화면에는 <b>버튼도, 스피너도, 「새로고침」 문구도 없다</b> — 갱신의 유일한 표면은 <b>기준시각 칩</b>과 값이 바뀐 행이다. 주기·요청 방식은 apply 슬라이스의 것이되, 보이는 규칙은 이렇다: 기준시각이 새로워졌을 때만 「갱신됨」(mono 11, --live/--live-tint)을 칩 옆에 붙이고 다음 갱신까지 유지한다.<br />
<b>바뀐 행 —</b> D-day·키 날짜·extras 중 하나라도 바뀐 행, 그리고 창 안으로 새로 들어온 행에 왼쪽 변 2px --live 인셋 엣지. 바뀐 값만 200ms(--dur-base) 페이드로 들어온다. 다음 갱신에서 엣지는 지워진다. 행 전체를 강조하거나 색을 뒤집지 않는다 (R1: hover도 색 반전 금지).<br />
<b>탭 숨김 —</b> 문서가 보이지 않는 동안에는 갱신하지 않고, 다시 보이면 즉시 한 번 읽는다 — 30분 방치한 탭에 30분 전 기준시각이 남아 있는 편이 조용히 오래된 화면보다 정직하다.<br />
<b>reduced-motion —</b> 페이드 없음(값은 즉시 교체), 엣지는 그대로 표시, 콜론 블링크·카운트다운 인터벌은 기존 규칙대로 정지. 갱신 자체는 계속된다 — 모션 설정은 데이터 정직성이 아니다.<br />
<b>stale과의 관계 —</b> 갱신 결과가 stale이면 R2의 그 처리 그대로 (칩 경고 + 탭 위 안내, 본문 불변). 갱신에 실패하면 <b>화면은 바뀌지 않는다</b> — 실패를 알리는 문구를 만들지 않는다 (기준시각이 낡아가는 것이 이미 그 사실이다). 다음 주기에 다시 시도한다.<br />
<div className="flag"><b>운영자 확인 (departure) —</b> 갱신 주기 값 자체는 이 라운드가 정하지 않았다 — 화면 규칙은 어떤 주기에서도 같기 때문이다. 설계 가정은 <b>60초</b>이며 (기준시각이 분 단위로 표시되므로 그보다 잦은 갱신은 화면에 나타나지 않는다), 실제 값은 apply 슬라이스가 백엔드 갱신 빈도에 맞춰 정한다.</div>
