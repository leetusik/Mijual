# jujutower.conf — jujutower.com, 주주의관제탑 (the Mijual product).
#
# WHAT THIS IS: the nginx vhost that fronts this product's containers
# (compose.prod.yml) on the shared OCI box. It terminates the origin TLS that
# Cloudflare connects to and proxies EVERYTHING to the Next.js container
# `mijual-web:3010` over the external `changple_shared_network`.
#
# WHERE IT LANDS: `/home/opc/edge/conf.d/jujutower.conf` on the box — the
# standalone edge (compose project `edge` at /home/opc/edge, container
# `edge-nginx`, sole owner of :80 and :443). `conf.d/` and `certs/` are READ-ONLY
# host bind mounts, so applying a change is a file drop plus a graceful reload.
#
# WHO OWNS THE COPY: this file's authoring home is the **Mijual** repo at
# `deploy/edge/jujutower.conf`; its live home is the **edge** repo's `conf.d/`.
# The edge repo is the operator's separate git repository — Mijual copies the
# file in and never commits there. See `deploy/edge/README.md` in this repo for
# the exact copy + the two script edits a new cert basename requires.
#
# HOW IT REACHES THE BOX (never a hand-run scp, never `docker cp` into the
# container): from the edge checkout, `./validate.sh` (local gate: dummy certs +
# `docker compose config -q` + `nginx -t` over the WHOLE conf.d/ tree) →
# `bash stage.sh` (rsync + stage the REAL cert pair on the VM + on-VM validate)
# → `bash deploy.sh` ON THE VM (`nginx -t` hard gate inside the running
# container, then `nginx -s reload`). A failed `nginx -t` reloads nothing, so a
# bad edit cannot take the edge — or any co-tenant — down.
#
# NEVER `up`, `restart` or `--force-recreate` edge-nginx. Recreating it drops the
# shared-network attachment and cascades into every co-tenant site on the box.
#
# ---------------------------------------------------------------------------
# HOUSE RULES — the conf.d/ tree is tested and reloaded AS A UNIT, so breaking
# one of these breaks EVERY site on the edge (changple5, changple.ai, hi2vi,
# knowledge, vocky), not just this one.
#
#   * NEVER declare `default_server`. `00-default.conf` owns the catch-all on
#     both ports (unknown Host/SNI → 444). This vhost routes by Host/SNI only.
#   * NO IPv6 `listen`. No sibling conf binds v6, so an IPv6 bind here would
#     silently make THIS vhost the default server for all v6 traffic.
#   * NO `limit_req_zone` and NO `map` — both live in the `http` context and
#     their NAMES are GLOBAL across the whole tree. `hi2vi.conf` declares the
#     tree's only rate-limit zone; a duplicate name is a hard `nginx -t` failure
#     that blocks the reload for every site. This product needs neither: the
#     login door and `/ask` are throttled IN THE APP (an in-process
#     per-(IP, route) login limiter and `ask.TurnLimiter`'s concurrency
#     ceiling), and Cloudflare sits in front of both.
#   * Every zone / upstream / variable name introduced here is prefixed
#     `jujutower_` for the same global-namespace reason. This file declares NO
#     named `upstream {}` block (variable `proxy_pass` instead), so it adds
#     exactly two global-ish names: `$jujutower_web` and the TLS session cache
#     `jujutower_tls`.
#   * NO gzip. The tree disables compression at the origin (Cloudflare
#     compresses at its edge) — and that is independently REQUIRED here: `/ask`
#     is an SSE stream whose response carries `Cache-Control: no-transform`
#     precisely because a gzip encoder holds the stream until it has a block to
#     emit, which turns the signed incremental 스트리밍 state into one late blob
#     (measured in P6.S7, in a real browser — `curl` without `Accept-Encoding`
#     never reproduces it).
#
# ---------------------------------------------------------------------------
# ROUTING — everything goes to ONE upstream, `mijual-web:3010`.
#
# `/api/*` is NOT split off at the edge. Next's own rewrite
# (`frontend/next.config.ts`: `/api/:path*` → `http://mijual-api:8010/:path*`)
# forwards it to FastAPI over the project-internal network, and `mijual-api` is
# not even resolvable from the edge network (measured, P4.S1). That is a landed
# security decision, not a convenience: the API grants no CORS and no preflight,
# and the CSRF guard (`X-Mijual-CSRF`, a header only same-origin code can set)
# rests on `/api/*` being same-origin. Splitting `/api/` off here would change
# the origin model and break it.
#
# `/ops` stays routable — the operator login door is public by design (it opens
# only with the separate ops credential and fails identically on a wrong one).
#
# ---------------------------------------------------------------------------
# THE CLOUDFLARE LOOP HAZARD (why the cut-over order in deploy/runbook.md R5 is
# load-bearing): `jujutower.com` is a NEW zone, and a new zone's SSL/TLS mode
# defaults to **Flexible**. With Flexible, Cloudflare fetches the origin over
# plain http — it would hit the `:80` server below, get the 301 to https, and
# loop. So the record goes proxied only AFTER SSL/TLS is set to **Full
# (Strict)**, and Full (Strict) is safe only once the REAL origin cert pair is
# staged (an invalid/missing origin cert under Full (Strict) is an instant 526).
# The order that works: real pair staged → this file in → `nginx -t` → reload →
# prove the origin directly with `curl --resolve` against 140.245.64.173 →
# SSL/TLS = Full (Strict) → DNS A proxied → external check → HSTS.
# 522 = wrong A record / origin unreachable. 526 = Full (Strict) + bad origin
# cert. 524 = the origin took longer than Cloudflare's ~100 s ceiling.
#
# This file ships with `:443` LIVE (not commented, unlike hi2vi's two-stage
# cut-over): the standalone edge's `validate.sh` generates a dummy pair for every
# `CERT_NAMES` basename, so `nginx -t` passes locally with no real cert, and
# `stage.sh` puts the real pair on the box before `deploy.sh` ever reloads.
# ---------------------------------------------------------------------------

# =====================================================================
# :80 — redirect everything to HTTPS. A server-level `return` executes before
# location matching, so nothing else belongs in this block.
# =====================================================================
server {
    listen 80;
    server_name jujutower.com;

    # If the operator takes the www alias (see the commented block below), add
    # `www.jujutower.com` to this server_name too — this redirect already sends
    # it to `https://$host…`, and the :443 block is where the apex 301 lives.
    return 301 https://$host$request_uri;
}

# =====================================================================
# :443 — the jujutower vhost. One upstream: the Next.js container.
# =====================================================================
server {
    listen 443 ssl;
    http2 on;
    server_name jujutower.com;

    # --- TLS ----------------------------------------------------------------
    # A Cloudflare **Origin CA** certificate for this zone, 15-year, minted in
    # the Cloudflare dashboard (SSL/TLS → Origin Server → Create Certificate).
    # The hi2vi wildcard does NOT cover jujutower.com, so this is a genuinely new
    # cert basename — which is why `validate.sh` and `stage.sh` in the edge repo
    # both need the two-line edit documented in deploy/edge/README.md.
    #
    # Source pair on the box: /home/opc/jujutower_tls/jujutower.com.{crt,key}
    # (key 600 opc:opc), mirroring /home/opc/hi2vi_tls/. `stage.sh` copies it to
    # /home/opc/edge/certs/jujutower.{crt,key} and verifies sha256 + pair match.
    #
    # Re-check the SANs any time with:
    #   openssl x509 -in /home/opc/edge/certs/jujutower.crt -noout -text \
    #     | grep -A1 'Subject Alternative Name'
    ssl_certificate     /etc/nginx/certs/jujutower.crt;
    ssl_certificate_key /etc/nginx/certs/jujutower.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    # Prefixed for the same global-namespace reason as everything else here.
    ssl_session_cache shared:jujutower_tls:10m;
    ssl_session_timeout 1d;

    # --- Docker DNS re-resolution (LOAD-BEARING) ----------------------------
    # The upstream is the `mijual-web` CONTAINER, whose IP changes every time it
    # is recreated — which is EVERY deploy (deploy/deploy.sh runs `up -d`) and
    # every box reboot. 127.0.0.11 is Docker's embedded DNS; a VARIABLE in
    # `proxy_pass` is what forces nginx to re-resolve at request time honouring
    # `valid=30s`. A literal `proxy_pass http://mijual-web:3010` resolves ONCE at
    # config load and then 502s forever after the next recreate — and the edge is
    # never reloaded by a Mijual deploy, so nothing would ever fix it.
    resolver 127.0.0.11 valid=30s ipv6=off;
    resolver_timeout 5s;
    set $jujutower_web mijual-web;

    # --- Cloudflare real-IP restore -----------------------------------------
    # Rewrites $remote_addr to the true client IP from CF-Connecting-IP, so the
    # access log — and the app's own per-IP login limiter, which reads
    # X-Forwarded-For — key off real visitors instead of the Cloudflare edge.
    # Ranges as published at https://www.cloudflare.com/ips/ — copied VERBATIM
    # from the sibling confs; refresh them together, never one file alone.
    # IPv4:
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    # IPv6:
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    # --- Security headers ----------------------------------------------------
    # This app emits NO security headers of its own (checked: nothing in
    # frontend/next.config.ts and nothing in the FastAPI app), so unlike the
    # vocky sibling there is no app CSP for these to compose with — the edge's
    # two are the only ones, and there is nothing here to conflict with or
    # strip. Raising the app's own set is a separate, deliberate decision.
    #
    # HSTS house style: SHORT max-age, NO includeSubDomains, NO preload. Bump it
    # only as a deliberate post-cut-over decision, once HTTPS is confirmed
    # healthy — a long max-age on a domain that later loses TLS is unrecoverable
    # from the visitor's side.
    add_header Strict-Transport-Security "max-age=300" always;
    # Additive: upgrades any stray http subresource reference. The product has
    # none today; this costs nothing and is the tree's convention.
    add_header Content-Security-Policy "upgrade-insecure-requests" always;

    # --- Request body --------------------------------------------------------
    # The product uploads NOTHING. The largest body it accepts is an /ask turn:
    # a 2,000-char question plus up to 8 history turns of <= 8,000 chars each
    # (`mijual.web.ask`), which is tens of KB even in UTF-8 Korean. 1m is
    # generous headroom and a small, honest ceiling on anything else.
    client_max_body_size 1m;

    # --- Shared proxy headers — HOISTED to server level ----------------------
    # HEADER-INHERITANCE FOOTGUN: nginx inherits `proxy_set_header` into a
    # `location` ONLY IF that location sets NONE of its own — the first
    # `proxy_set_header` inside a location silently drops the ENTIRE inherited
    # set. So the shared set lives here and EVERY ordinary location below sets
    # none. The ONE location that must set its own (`= /api/ask`, which needs
    # its streaming directives) re-declares ALL of them; that re-declaration is
    # not redundancy, it is the price of the footgun.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # --- ROUTING -------------------------------------------------------------
    # Longest-prefix wins (there are no regex locations here), and an exact `=`
    # match beats every prefix. The whole map is:
    #
    #   = /api/ask   -> mijual-web:3010, SSE-safe (the streaming block below)
    #   /            -> mijual-web:3010, everything else
    #
    # `/api/*` reaches FastAPI from INSIDE the web container, through Next's
    # rewrite. Do not add an `/api/` location.

    # The AI 질문 stream. `POST /api/ask` answers `text/event-stream`
    # (`mijual.web.ask`), and it is the only streaming surface in the product.
    #
    # EXACT `=` match, deliberately: a prefix `/api/ask` would ALSO swallow the
    # sibling `GET /api/ask/start-cards`, an ordinary buffered JSON response
    # that has no business carrying `X-Accel-Buffering: no` or an hour-long read
    # timeout. `= /api/ask` matches exactly the one streaming route.
    #
    # The directive set is copied wholesale from `changple-web.conf`'s
    # `location /bff/` — the tree's proven SSE block, marked "do not tidy" there
    # — with the upstream swapped. What each line is for:
    #   proxy_buffering off          nginx buffers a proxied response by default,
    #                                which turns an incremental stream into one
    #                                late blob;
    #   proxy_request_buffering off  the request side, for symmetry with the
    #                                proven block;
    #   proxy_cache off              an SSE body is per-reader and per-corpus-
    #                                moment; a cached one is another reader's
    #                                answer;
    #   chunked_transfer_encoding on keeps the response chunked rather than
    #                                waiting on a Content-Length that never comes;
    #   proxy_read_timeout 3600s     there is NO heartbeat between frames and the
    #                                longest gap measured with the live agent is
    #                                6.0 s, so an idle timeout under ~10 s cuts
    #                                legitimate turns. (Cloudflare still caps the
    #                                whole origin response at ~100 s → a 524,
    #                                whatever this says; one turn must stay well
    #                                under that.)
    #   add_header X-Accel-Buffering no
    #                                belt-and-braces: the app already sends this
    #                                header itself, and nginx must pass its
    #                                `Cache-Control: no-store, no-transform` and
    #                                `X-Accel-Buffering: no` through UNTOUCHED.
    #
    # NOTE the re-declared `proxy_set_header` block: it is the server-level set
    # verbatim. Removing any line here removes it from this route only, silently.
    location = /api/ask {
        proxy_pass http://$jujutower_web:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 3600s;
        add_header X-Accel-Buffering no;
        # `add_header` inherits exactly like `proxy_set_header` does — all or
        # nothing. MEASURED in the P4.S3 rehearsal: with only the line above,
        # this route's responses carried NO Strict-Transport-Security and NO
        # Content-Security-Policy, because declaring one add_header here
        # dropped both server-level ones. Re-declared, for the same reason the
        # proxy_set_header block above is re-declared.
        add_header Strict-Transport-Security "max-age=300" always;
        add_header Content-Security-Policy "upgrade-insecure-requests" always;
    }

    # Everything else: the reader pages, `/ops`, every Next asset, and every
    # `/api/*` call the browser makes (forwarded to FastAPI by Next's rewrite
    # inside the container). No URI part after the port, so the original request
    # URI passes through unchanged — and the variable form is what makes the
    # re-resolution above work. Deliberately NO `proxy_set_header` here: it
    # inherits the full server-level set (the footgun note above).
    #
    # 300s read timeout: every reader route is server-rendered from FastAPI on
    # each request, so a slow first render must not be cut at nginx's 60s
    # default — but Cloudflare's ~100s ceiling is the real limit either way.
    location / {
        proxy_pass http://$jujutower_web:3010;
        proxy_connect_timeout 5s;
        proxy_read_timeout 300s;
    }
}

# =====================================================================
# OPTIONAL — the `www.jujutower.com` alias. NOT ENABLED: an open Operator
# Question (it changes the Origin CA cert's SAN list and adds one DNS record).
#
# To take it: (1) mint the Origin CA cert with BOTH `jujutower.com` and
# `www.jujutower.com` in its SANs — a cert covering only the apex makes the
# block below fail TLS before the redirect can run; (2) add a proxied DNS record
# for `www`; (3) add `www.jujutower.com` to the `:80` server_name above; (4)
# uncomment this block. The apex stays canonical and www 301s to it, which is
# also what `frontend`'s canonical/sitemap work (P4.S5) assumes.
#
# server {
#     listen 443 ssl;
#     http2 on;
#     server_name www.jujutower.com;
#
#     ssl_certificate     /etc/nginx/certs/jujutower.crt;
#     ssl_certificate_key /etc/nginx/certs/jujutower.key;
#     ssl_protocols TLSv1.2 TLSv1.3;
#     ssl_prefer_server_ciphers off;
#
#     return 301 https://jujutower.com$request_uri;
# }
