# Local development infrastructure for the Mijual pipeline.
#
#   docker compose up -d postgres          # the P2 dev path
#   docker compose --profile scheduling up -d redis   # P2.S6 (Celery broker)
#
# With redis up, the scheduler runs as:
#   .venv/bin/celery -A mijual.scheduler.app worker -l info -c 1
#   .venv/bin/celery -A mijual.scheduler.app beat   -l info
# and without it as `.venv/bin/python -m mijual.scheduler once` (same code path).
#
# The HTTP layer (P5.S1) is a plain process, deliberately NOT a compose service —
# deployment is P4's, and a dev server that reloads on save should not be a
# container:
#   .venv/bin/uvicorn mijual.web.app:app --reload      # http://127.0.0.1:8000
#   curl -s http://127.0.0.1:8000/health
# `/health` needs only the process, not postgres: the board goes stale, never dark.
#
# Host port 5433 keeps a system/other-project Postgres on 5432 out of the way.
# These credentials are local-dev only and are NOT secrets: real secrets
# (DART_API_KEY, GEMINI_API_KEY) live in the gitignored repo-root .env.
# `psql` is not on PATH on the dev machine — verify through SQLAlchemy.

services:
  postgres:
    image: postgres:16
    container_name: mijual-postgres
    environment:
      POSTGRES_USER: mijual
      POSTGRES_PASSWORD: mijual
      POSTGRES_DB: mijual
    ports:
      - "5433:5432"
    volumes:
      - mijual-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mijual -d mijual"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Celery broker + result backend for the P2.S6 scheduler, and the store behind
  # its run lock. Behind a profile so a plain `up` does not start a broker for a
  # developer who only wants the corpus.
  redis:
    image: redis:7
    container_name: mijual-redis
    profiles: ["scheduling"]
    ports:
      - "6380:6379"
    volumes:
      - mijual-redisdata:/data

volumes:
  mijual-pgdata:
  mijual-redisdata:
