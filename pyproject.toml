[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mijual"
version = "0.1.0"
description = "Mijual — 상장사 권리(신주인수권/오버행/매수청구권) 수집·추출·검증 파이프라인"
requires-python = ">=3.13"
dependencies = [
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    # P2.S4 — §3.6 layer 1 (Gemini schema extraction). Only the extractor imports
    # it, and only when it actually calls: collection, parsing and the tests run
    # without a credential and without this package resolving anything.
    "google-genai>=1.0",
    # P2.S6 — scheduled collection. `celery` is imported only by the worker, beat
    # and `python -m mijual.scheduler schedule`; `redis` only by the run lock and
    # as the broker/backend transport (compose.yaml, host 6380). The inline
    # `python -m mijual.scheduler once` path needs neither to be running.
    "celery>=5.4",
    "redis>=5.0",
    # P5.S1 — the HTTP layer (`mijual.web`). Only that package imports them; the
    # pipeline, its CLIs and every other test run without either resolving.
    # `uvicorn` is a runtime dependency rather than a dev one because serving IS
    # the product in P5 and P4 deploys this same process.
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
# P5.S1 — `httpx` is what `fastapi.testclient.TestClient` transports over. It is
# already present transitively via `google-genai`; declared here so the web smoke
# test does not depend on that accident.
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.hatch.build.targets.wheel]
packages = ["src/mijual"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
